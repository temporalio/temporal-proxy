# Parca pull-mode config: scrapes pprof from the proxy.  Parca shares the
# proxy container's network namespace, so 127.0.0.1:8445 is reachable.

object_storage:
  bucket:
    type: FILESYSTEM
    config:
      directory: /var/lib/parca

scrape_configs:
  - job_name: temporal-proxy
    scrape_interval: 10s
    static_configs:
      - targets: ["127.0.0.1:8445"]
        labels:
          service: temporal-proxy
    profiling_config:
      pprof_config:
        process_cpu:
          enabled: true
          path: /debug/pprof/profile
          delta: true
        heap:
          enabled: true
          path: /debug/pprof/heap
          delta: true
        goroutine:
          enabled: true
          path: /debug/pprof/goroutine
        mutex:
          enabled: true
          path: /debug/pprof/mutex
          delta: true
        block:
          enabled: true
          path: /debug/pprof/block
          delta: true
