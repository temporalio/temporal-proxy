syntax = "proto3";

package api.auth.v1;

import "api/auth/v1/auth.proto";

option go_package = "github.com/temporalio/temporal-proxy/pkg/api/auth/v1;auth";

// AuthService is the contract for a pluggable inbound authenticator. The proxy
// ships with built-in authenticators for a fixed static token and for OIDC/JWKS
// validation. An operator whose identity system fits neither (a policy engine,
// an internal session service, an opaque token only their backend can redeem)
// can instead run their own authenticator as a gRPC server implementing this
// service and point the proxy at it.
//
// The proxy terminates inbound authentication rather than passing it through, so
// this service is asked once per inbound stream, before the stream is routed,
// and nothing reaches an upstream until it admits the caller. The operator
// declares which headers carry the caller's credentials: the proxy lifts those
// into AuthRequest and strips them from the stream it forwards, so a credential
// this service consumes never reaches an upstream.
service AuthService {
  // Auth reports whether the caller behind the current stream may proceed. The
  // verdict travels in the response's decision, and only DECISION_ALLOW admits,
  // so a response left unfilled denies rather than admitting by accident.
  //
  // Return an error only for having reached no verdict at all, such as a backend
  // this server cannot itself reach. The proxy denies either way, but an error
  // keeps its status code, so UNAVAILABLE or DEADLINE_EXCEEDED tells a worker to
  // retry where a denial tells it not to bother. A provider that cannot reach its
  // own backend should report that rather than admit the caller: an authenticator
  // that fails open is worse than one that is down.
  rpc Auth(AuthRequest) returns (AuthResponse) {}
}
