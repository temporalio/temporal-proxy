version: 2
updates:
  - package-ecosystem: gomod
    # examples replaces the root module with ../, so a root bump that leaves
    # examples/go.mod behind breaks `mise run build`. Group by dependency name so
    # each bump lands in both modules in one PR.
    directories:
      - /
      - /examples
    groups:
      go-modules:
        group-by: dependency-name
        patterns:
          - "*"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: go.temporal.io/api
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
